name: Atualizar Radar Literário

on:
  schedule:
    - cron: "0 9 * * *"     # todo dia às 09:00 UTC = 06:00 em Brasília
  workflow_dispatch:         # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar notícias
        run: python coletor/coletar.py

      - name: Publicar
        run: |
          git config user.name  "radar-literario[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api
          if git diff --cached --quiet; then
            echo "Nada novo."
          else
            git commit -m "Edição de $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
