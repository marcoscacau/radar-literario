name: Remover publicações

# O botão Remover da página grava docs/api/removidos.json; aqui a API é refeita sem o que saiu.
on:
  push:
    branches: [main]
    paths: [docs/api/removidos.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar               # o mesmo grupo da edição diária, para os dois não gravarem ao mesmo tempo
  cancel-in-progress: false

jobs:
  remover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refazer a API sem os removidos
        run: python coletor/coletar.py --so-remover

      - name: Publicar
        run: |
          git config user.name  "radar-literario[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api
          if git diff --cached --quiet; then
            echo "Nada novo."
          else
            git commit -m "Removidas da API: $(TZ=America/Sao_Paulo date '+%d/%m %Hh%M')"
            git pull --rebase
            git push
          fi
