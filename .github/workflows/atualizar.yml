name: Atualizar Radar Literário

on:
  schedule:
    - cron: "0 9 * * *"     # todo dia às 09:00 UTC = 06:00 em Brasília
  workflow_dispatch:         # botão "Run workflow" para rodar na hora

permissions:
  contents: write
  issues: write              # alerta de lançamento vira issue (o GitHub manda e-mail)

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # quem esperou na fila do grupo radar parte do que o anterior acabou de publicar

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar notícias
        run: python coletor/coletar.py

      - name: Promoções do Kindle
        continue-on-error: true    # se o Pelando ou o Gatry mudarem a página, a edição sai mesmo assim
        run: python coletor/kindle.py

      - name: Publicar
        run: |
          git config user.name  "radar-literario[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api
          if git diff --cached --quiet; then
            echo "Nada novo."
          else
            git commit -m "Edição de $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - name: Avisos (lançamentos e eventos em Sergipe)
        if: hashFiles('alerta.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create aviso --color F3DCDC --description "Lançamento de autor acompanhado ou evento literário em Sergipe" 2>/dev/null || true
          gh issue create --title "Avisos do Radar — $(TZ=America/Sao_Paulo date +%d/%m/%Y)" --label aviso --body-file alerta.md

      - name: Telegram
        continue-on-error: true    # falha no Telegram não derruba a edição
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python coletor/telegram.py

      - name: Celular (ntfy)
        continue-on-error: true
        env:
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
        run: python coletor/ntfy.py
